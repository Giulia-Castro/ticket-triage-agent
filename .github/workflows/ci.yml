name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triage
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (unit + integration, coverage >= 80%)
        run: pytest

      - name: Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://triage:triage@localhost:5432/triage
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Offline eval smoke test (keyword baseline, no API cost)
        run: python -m evals.run_evals --agent keyword
